[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svgplot"
version = "0.1.0"
description = "Aesthetic, markdown-friendly SVG plotting for Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "lovit", email = "soy.lovit@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# No runtime dependencies. The one that used to be here was numpy, for a single call in
# stats/binning.py; that call is now stdlib and bit-identical to what numpy returned.
dependencies = []

[project.optional-dependencies]
# PNG export (svgplot.output.png). Pinned >=2.7.0: earlier versions are affected
# by an SSRF issue (CVE-2023-27586) via external references in untrusted SVG input.
png = ["cairosvg>=2.7.0"]

# Only for the tests that check stats.binning still agrees with numpy edge for edge. Nothing
# in svgplot imports numpy.
numpy-parity = ["numpy>=2.5.2"]

[project.urls]
Homepage = "https://github.com/lovit/svgplot"
"Bug Tracker" = "https://github.com/lovit/svgplot/issues"

[dependency-groups]
dev = [
    "prek>=0.4",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.ruff]
line-length = 127
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
