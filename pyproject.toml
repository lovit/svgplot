[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svgplot"
version = "0.1.0"
description = "Aesthetic, markdown-friendly SVG plotting for Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "lovit", email = "soy.lovit@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.5.2",
]

[project.urls]
Homepage = "https://github.com/lovit/svgplot"
"Bug Tracker" = "https://github.com/lovit/svgplot/issues"

[dependency-groups]
dev = [
    "prek>=0.4",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.ruff]
line-length = 127
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
