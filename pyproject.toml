[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svgplot"
version = "0.1.0"
description = "Aesthetic, markdown-friendly SVG plotting for Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "lovit", email = "soy.lovit@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# No runtime dependencies. The one that used to be here was numpy, for a single call in
# stats/binning.py; that call is now stdlib and bit-identical to what numpy returned.
dependencies = []

[project.optional-dependencies]
# PNG export (svgplot.output.png). Pinned >=2.7.0: earlier versions are affected
# by an SSRF issue (CVE-2023-27586) via external references in untrusted SVG input.
# cssselect2 is pinned because cairosvg declares it without a bound and rasterizes through
# it: every chart's CSS uses :where() since #182, and 0.4.1 rejects that outright
# (SelectorError: Unknown pseudo-class). Without the floor, save("x.png") goes from
# working to raising for anyone whose environment resolves an older cssselect2.
png = ["cairosvg>=2.7.0", "cssselect2>=0.5"]

# Only for the tests that check stats.binning still agrees with numpy edge for edge. Nothing
# in svgplot imports numpy. `mise run install` installs this extra so CI actually runs that
# comparison -- `uv sync --all-groups` installs dependency *groups* and no extras, so without
# it the one automated defence of this package's headline claim is skipped on every run.
numpy-parity = ["numpy>=2.3.0"]

[project.urls]
Homepage = "https://github.com/lovit/svgplot"
"Bug Tracker" = "https://github.com/lovit/svgplot/issues"

[dependency-groups]
dev = [
    # Imported directly by tests/test_packaging.py to read version specifiers as versions
    # rather than as strings. It arrives transitively through pytest today; declaring it
    # means the test does not break the day that stops being true.
    "packaging>=24",
    "prek>=0.4",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.ruff]
line-length = 127
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
